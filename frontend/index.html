<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230972d3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='20' height='14' x='2' y='5' rx='2'/><line x1='2' x2='22' y1='10' y2='10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniStore OS - Retail & Wholesale Management</title>
    <style>
      /* Mobile Touch & Viewport Optimizations */
      html, body {
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
      }

      @media (max-width: 768px) {
        /* Full width modals on small screens */
        [role="dialog"] {
          max-width: 96vw !important;
          margin: 6px auto !important;
        }

        /* Prevent auto-zooming on mobile iOS form fields */
        input, select, textarea {
          font-size: 16px !important;
        }
      }

      @media print {
        @page {
          margin: 0;
          size: auto;
        }

        html, body {
          background: #ffffff !important;
          color: #000000 !important;
          height: auto !important;
          min-height: auto !important;
          overflow: visible !important;
          margin: 0 !important;
          padding: 0 !important;
        }

        /* Hide general DOM elements */
        body * {
          visibility: hidden;
        }

        /* Display only printable document containers */
        #thermal-receipt-container,
        #thermal-receipt-container *,
        #tax-invoice-a4-container,
        #tax-invoice-a4-container *,
        #z-report-paper,
        #z-report-paper * {
          visibility: visible;
        }

        /* 80mm / 58mm POS thermal receipt printable area */
        #thermal-receipt-container {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 72mm !important;
          max-width: 72mm !important;
          margin: 0 !important;
          padding: 2mm !important;
          box-shadow: none !important;
          border: none !important;
          background: #ffffff !important;
          color: #000000 !important;
          font-family: "Courier New", Courier, monospace !important;
          page-break-after: avoid !important;
        }

        /* Formal A4 Tax Invoice document */
        #tax-invoice-a4-container {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          margin: 0 !important;
          padding: 10mm !important;
          box-shadow: none !important;
          border: none !important;
          page-break-after: avoid !important;
        }

        /* Daily Z-Report Cash Closing paper */
        #z-report-paper {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 72mm !important;
          max-width: 72mm !important;
          margin: 0 !important;
          padding: 2mm !important;
          box-shadow: none !important;
          border: none !important;
          page-break-after: avoid !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
